<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" width="1000" height="140">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B0000" />
      <stop offset="50%" stop-color="#FF1E27" />
      <stop offset="100%" stop-color="#8B0000" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <text x="50%" y="95" font-family="'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="92" fill="url(#redGradient)" filter="url(#glow)" letter-spacing="24" text-anchor="middle">ANTARES</text>
</svg>
